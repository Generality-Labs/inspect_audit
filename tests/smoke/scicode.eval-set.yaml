name: ia-smoke-scicode
packages:
- inspect-ai==0.3.285
- inspect-audit[runner,k8s] @ git+https://github.com/Generality-Labs/inspect_audit@SELF
- inspect-evals[scicode] @ git+https://github.com/xantheocracy/inspect_evals@369d6ae1de4a7870b4c4119d12bd49a6e484ed64
tasks:
- package: inspect-audit[runner,k8s] @ git+https://github.com/Generality-Labs/inspect_audit@SELF
  name: inspect_audit
  items:
  - name: audit
    args:
      repo: https://github.com/xantheocracy/inspect_evals
      revision: 369d6ae1de4a7870b4c4119d12bd49a6e484ed64
      target_task: inspect_evals/scicode
      source: inspect_evals.scicode.scicode
      task_package: inspect-evals[scicode] @ git+https://github.com/xantheocracy/inspect_evals@369d6ae1de4a7870b4c4119d12bd49a6e484ed64
      task_args:
        provide_scientific_background: false
        timeout: 1800
        include_dev_set: false
        scaling: false
        scaling_token_limit: 200000
        feedback: null
        stop_on_success: false
        scaling_agent: react
      investigation_samples: all
      checks:
      - gold-answer
      policy:
        models:
          auditor:
          - openai/openrouter/deepseek/deepseek-v4.1-flash-1017
          investigators:
          - openai/openrouter/deepseek/deepseek-v4.1-flash-1017
          subjects:
          - openai/openrouter/deepseek/deepseek-v4.1-flash-1017
          judges: []
        inputs:
          logs:
          - hawk:scicode-provider-default-pgcjfyx2vbyas1w5
        limits:
          investigation_sample_cost_usd: 0.25
          max_concurrent_jobs: 3
          budget_usd: 2.0
      runs: hawk
      # TEMPORARY (FRICTION 93): children with the operator's login until Hawk has its token service
      credential_mode: user
      box: k8s
      instructions: 'This case: logs hawk:scicode-provider-default-pgcjfyx2vbyas1w5 (65 samples; use ONE).
        Jobs: send_investigators on one sample, check gold-answer, with the supplied logs, item_cost_limit
        0.25; run_eval with code: a small harmless wording change to the task''s prompt, at its installed
        path, on the same sample with the subject model.'
models:
- package: inspect-ai
  items:
  - name: openai/openrouter/deepseek/deepseek-v4.1-flash-1017
cost_limit: 2.0
message_limit: 400
retry_attempts: 0
