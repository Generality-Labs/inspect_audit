name: ia-api-free-native-k8s-20261022
packages:
- inspect-audit[k8s] @ git+https://github.com/Generality-Labs/inspect_audit@SELF
- inspect-ai==0.3.266
tasks:
- package: git+https://github.com/Generality-Labs/inspect_audit@SELF#subdirectory=tests/compatibility
  name: ia_compatibility
  items:
  - name: probe
    args:
      spec:
        task: ia_compatibility/native_k8s
        source: ia_compatibility.fixtures
        package: ia-compatibility @ git+https://github.com/Generality-Labs/inspect_audit@SELF#subdirectory=tests/compatibility
        task_args: {}
        logs: []
        judges: {}
        auditor_image: ghcr.io/generality-labs/inspect-audit-auditor@sha256:63665b4948b4adfe9767079ceb9a5d70fe39c0f56518e700a55b0313fa1e52aa
        samples:
        - native
        selection: 'Native Helm values: two services, environment variables, resources,
          sample files, setup script and a named-service grader.'
      limit: 1
models:
- package: openai
  name: openrouter
  items:
  - name: openai/gpt-6-luna
cost_limit: 0.01
time_limit: 1200
retry_attempts: 0
max_retries: 2
epochs: 1
runner:
  environment:
    HAWK_API_URL: https://api.hawk.hawk.generalitylabs.ai
