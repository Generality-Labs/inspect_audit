# Audit benchmark items with inspect_audit's sample auditors. Copy, edit, save, hawk_submit.
# `logs` is either the seed's remote.supplied_logs or hawk:<eval set id of a job you ran>.
# Both are fetched through the Hawk API, so a job reads them whatever its own id is; the
# id is assigned at submission and is not yours to set.
name: inv-audit-smoke
packages:
  - <remote.audit_package>
  - <remote.task_package>
tasks:
  - package: <remote.audit_package>
    name: inspect_audit
    items:
      - name: audit
        args:
          task: <registry name of the audited task, e.g. benchmark/task>
          # task_args: {...}                    # exactly as the logs ran it; checked against every header
          samples: ["1"]                        # the benchmark's sample ids to audit, or "all"
          checks: [gold-answer, answer-format, red-teaming, insufficiently-specified, other-findings]
          logs: [<remote.supplied_logs, or hawk:<eval set id of your job>>]
          source: <module of the task's file, e.g. inspect_evals.simpleqa.simpleqa>
          auditor_image: <remote.auditor_image>
          # judge: {grader: openrouter/...}     # only without logs; with logs the judge is the logged one
          # notes: a general steer for every auditor; never an answer
models:
  - package: openai
    name: openrouter
    items:
      - name: openai/gpt-5.6-luna          # the auditor
        args:
          config:
            reasoning_effort: medium       # the auditor's effort goes here, not in task args
model_roles:
  grader:                                  # the benchmark's judge: must be the model its logs record
    package: openai
    name: openrouter
    items:
      - name: openai/gpt-5-mini
        args:
          config:
            reasoning_effort: low
runner:
  environment:
    HAWK_API_URL: <remote.hawk>
limit: 1                                   # audited items (= len(samples)); the size the reservation uses
cost_limit: 2.00                           # dollars per audited item, enforced in the runner
epochs: 1
time_limit: 7200
max_connections: 5
max_retries: 10
retry_attempts: 0        # a first job fails once; raise it only once the config works
timeout: 600
