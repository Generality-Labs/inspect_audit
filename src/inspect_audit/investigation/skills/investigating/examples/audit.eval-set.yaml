# Audit benchmark items with inspect_audit's sample auditors. Copy, edit, save, hawk_submit.
# `logs` must be either the seed's remote.supplied_logs (then set eval_set_id to its id) or
# hawk:<eval set id of a benchmark job you ran> (then omit eval_set_id).
name: inv-audit-smoke
eval_set_id: <id inside remote.supplied_logs, when auditing the supplied logs>   # otherwise omit
packages:
  - <remote.audit_package>
  - <remote.task_package>
tasks:
  - package: <remote.audit_package>
    name: inspect_audit
    items:
      - name: audit
        args:
          task: <registry name of the audited task, e.g. inspect_evals/simpleqa_verified>
          logs: <remote.supplied_logs, or hawk:<eval set id of your job>>
          items: [gold-answer, answer-format, red-teaming, insufficiently-specified, other-findings]
          auditor_image: <remote.auditor_image>
          limit: 1                       # or samples: ["<id>", ...]
          # notes: a general steer for every auditor; never an answer
models:
  - package: openai
    name: openrouter
    items:
      - name: openai/gpt-5.6-luna          # the auditor
        args:
          base_url: https://openrouter.ai/api/v1
model_roles:
  grader:                                  # the model the benchmark's scorer calls, if it calls one
    package: openai
    name: openrouter
    items:
      - name: openai/gpt-5-mini
        args:
          base_url: https://openrouter.ai/api/v1
          config:
            reasoning_effort: low
runner:
  environment:
    HAWK_API_URL: <remote.hawk>
    HAWK_RUNNER_REFRESH_URL: ""
  secrets:
    - name: OPENROUTER_API_KEY
epochs: 1
token_limit: 4000000
time_limit: 7200
max_connections: 5
max_retries: 10
retry_attempts: 0
timeout: 600
