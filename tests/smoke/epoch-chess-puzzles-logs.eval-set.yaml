      overview: "Chess Puzzles (Epoch AI) is 100 chess positions, generated programmatically by Epoch, each given as a FEN string; the model must name the single best next move for the side to move. Positions come from games in which the first six full moves are random and the rest are played by Stockfish at a random Elo; full-strength Stockfish (depth 18 by Epoch's account; the Stockfish version is not recorded) then keeps positions with a single best move the weaker player missed, using three thresholds on the engine's evaluations (best move > -100 cp, second-best < 80 cp, gap > 180 cp), and drops positions whose best move captures an undefended piece or a higher-value piece with a lower-value one. The task under review is bench/Chess Puzzles (the registry name the mirror and Epoch's 2.x logs use), Epoch's Chess Puzzles version 2.1.0 vendored unchanged (imports aside) from epoch-research/chess-puzzles-mirror @62f4f8d3 into bench/task/chess_puzzles_v2: the model runs in qa_agent (qa_agent.py) with a submit_answer tool, an output-token budget of 1,000,000 and compaction at 900,000 input tokens (this audit's task arguments, the settings the supplied logs record), continuation of cut-off responses and a forced final answer when the budget runs out; scorer.py (bench/exact) credits the submitted string if it equals the key after normalising case and wrapping, or, failing that, if it reads as the key's move in the position: UCI with a separator or check mark, or SAN (including long algebraic and castling) parsed with python-chess, which must name exactly one legal move (so an ambiguous SAN such as Rd3 when two rooks reach d3 scores incorrect). Each item has one key in UCI from-to notation; there are no judge models. CHANGELOG.md in the same directory is Epoch's version history (1.x used an LLM answer extractor; 2.0.0 moved to qa_agent and exact match; 2.1.0 added SAN). Sample ids are 1-100 in puzzles.csv order. All 100 keys are legal moves; none is a promotion or castling; 28 are captures and 12 give check; 51 positions have White to move. Evaluation logs are supplied: 14 of Epoch's leaderboard runs of Chess Puzzles 2.0.0 (epoch-research/benchmarks @6a984da2, inspect_ai 0.3.273, 2026-10-13/14), one hawk source, each run over all 100 puzzles with one epoch: claude-fable-5 (high, max), claude-opus-4-6 (max), claude-opus-4-7 (xhigh, max), claude-opus-4-8 (max), claude-opus-5 (max), claude-sonnet-4-6 (high, max), claude-sonnet-5 (xhigh, max), deepseek-v4-pro (high, max) and glm-5.2 (max); the bracket is the reasoning effort, so a model listed twice is two leaderboard configurations, not a duplicate. Their scores run from 15% (deepseek-v4-pro high) to 52% (claude-opus-4-8). Each item therefore has 14 recorded submissions and grades. The logs were scored by 2.0.0's scorer, plain UCI exact match without 2.1.0's SAN and UCI-variant reading (Epoch's changelog: 44 of 18,029 scored 2.0.x samples named the solution in another notation and scored incorrect), so a reproduced grade that differs from a recorded one is first a build difference. They record no judge roles. Epoch's full import on Hawk (imported-epoch-chess-puzz-hx30q4zlqv5vk9vv) holds 48 runs of 36 models (45 at 2.0.0, 3 at 2.0.1, all max_output_tokens 1,000,000) whose compaction thresholds differ by provider (90% of each model's context window: 900,000 for these 14; 945,000 for 12 newer OpenAI runs; 943,718 for 7 Gemini and Kimi runs; 360,000 for 11 GPT-5.0-5.4 runs; 180,000 for 4 o-series runs); an audit's jobs read only logs whose task arguments equal the declared ones, so only this group is supplied, and the other 34 runs (all OpenAI, Gemini and Kimi models) are not part of the evidence. Rate elicitation and bias on the supplied runs and say this in their explanations. The sample is the whole population, all 100 puzzles (census), in both phases."
      instructions: "An Epoch review with logs supplied: phase 1 then phase 2 in this one run, as the epoch-review skill says, then submit and publish. No smoke routine. The whole review has $150. Phase 1, blind to the logs: send_investigators with check question-labels and logs=[] on the 100 investigation_samples (the skill's two-item pilot, then the rest in one job); every sample must end resolved (re-send any item left without a verdict or UNRESOLVED, with the previous worker's notes). Apply the epoch-review skill's adversarial second-worker step to NO_ISSUE_FOUND items where the first worker's engine check was shallow or found a second move close to the key, and decide on both workers' evidence. Brief workers with the item in /audit/item.json (FEN and key). Each worker installs a current Stockfish in its box (apt-get install -y stockfish, or the official Linux binary from https://github.com/official-stockfish/Stockfish/releases, fetched with curl) and uses python-chess (installed with the benchmark) to drive it, and records the Stockfish version, depth and MultiPV lines it used. For every item they check: whether the FEN is a legal, well-formed position whose side to move, castling and en passant fields are consistent; whether the key is a legal move and the best move by a clear margin when analysed with MultiPV of at least 3 to depth 24 or more (deeper where the top two are close or the evaluation changes with depth), comparing against depth 18; whether another move is as good as the key for practical purposes (for example both win decisively, both mate, or both are within about 50 cp of each other in a balanced or winning position), so that a strong player's answer other than the key would be marked wrong; whether Epoch's stated thresholds (best > -100 cp, second-best < 80 cp, gap > 180 cp) hold at depth 18 and at depth, noting where they fail without that alone being a defect; and whether a correct answer written in a natural form (UCI, UCI with a separator or check mark, SAN, long algebraic, a lowercase piece letter) would be scored incorrect, using the grade tool to push candidate submissions through the real scorer. The benchmark is installed in their box and loads with `from bench.task.chess_puzzles_v2 import chess_puzzles_v2`; scorer.py there holds read_move. An item is DEFECT only if its key is wrong (not the best move at depth), another move is as good as the key so a strong player's natural answer is misgraded, the position is malformed or cannot be answered as written, or a plausible answer, one a competent model would naturally give, is misgraded; use your own judgment of plausibility. A mismatch you can show only with a constructed or unlikely answer, or a threshold that fails while the key stays clearly best, leaves the item NO_ISSUE_FOUND, with the mismatch recorded in its notes. Give workers this same bar in their brief. A property of the scorer shared by every item (for example how ambiguous SAN is treated) is reported once, in the scoring explanation and the limitations. Rate reviewability and benchmark_consistency from the source (CHANGELOG.md, the mirror README and Epoch's published methodology at https://epoch.ai/benchmarks/chess-puzzles), and scoring_integrity from the sample labels. Phase 2, once phase 1's rows are rated and none is a Flag: send_investigators with check grading-labels on the same 100 samples, logs=[the one supplied hawk source], judge \"{}\" (the logs record no judge), one job. Brief these workers that each item has 14 recorded attempts, that they should first list every attempt's submitted answer and recorded grade (the score's answer field), push every distinct submission through the grade tool, and open a transcript only where the recorded grade looks doubtful (for example a submission in SAN, long algebraic or with a separator that names the key's move, an answer the forced final answer produced, an errored or empty submission, or a submit_answer call the scorer did not see); transcripts from max-effort runs can be very long, so they must not read whole transcripts by default. A recorded grade that 2.1.0's scorer would reverse because the answer named the key in another notation is a grading defect in the logs (a build difference: say so), not a defect of the 2.1.0 task. Then rate elicitation and bias from the log headers and transcripts (budgets, reasoning effort, forced final answers, cut-off continuations, errored samples), the quality rows you can answer, and construct validity last, as the epoch-review skill says. The defect rate is the union: an item defective as written or as graded counts once. Scoring row fields: sample_design census; drawn_by 'Laurence Wroe (all 100 puzzles)'; population 100 (an integer). In its explanation say the population is the benchmark's 100 puzzles, give the defect counts by kind (key not best, a co-best alternative, scorer misgrade, recorded grade wrong in the logs), and report how many items failed Epoch's thresholds at depth 18 while their key stayed best. Each investigator has its own $3 budget: one that reaches it is stopped and records its best estimate with its reasoning (its scores carry budget_capped: true). Review those verdicts like any other, do not relaunch them, and report in the limitations how many investigators reached their budget (count budget_capped in the collected job logs). Be budget-aware: keep enough for phase 2, re-sends, submission and publishing. Submit, then publish with the epoch publisher: write prose.json, preview_review, publish_document."
models:
- package: inspect-ai
  items:
  - name: openai/openrouter/openai/gpt-6.2-sol
message_limit: 2000
retry_attempts: 0
# the audit task fetches its hawk: logs when it loads, and Hawk does not tell a
# runner where its own API is
runner:
  environment:
    HAWK_API_URL: https://api.hawk.hawk.generalitylabs.ai
