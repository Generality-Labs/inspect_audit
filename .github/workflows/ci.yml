name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a newer push supersedes the run still going for the same PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Moving major tag on purpose (see .github/zizmor.yml): we own this repo,
    # so CI fixes flow in without a bump PR per template release. Dependabot
    # is told to leave it alone in .github/dependabot.yml — don't "helpfully"
    # pin this to an exact version, or copier update will just revert it.
    uses: Generality-Labs/python-project-template/.github/workflows/python-ci.yml@v1
    with:
      python-version: "3.13"
      typecheck-paths: "src tests/compatibility/src/ia_compatibility tests/compatibility/run_suite.py"

  # One real-container lifecycle gate on PRs; the complete Docker suite on main.
  docker:
    name: Docker tests
    # Full report tests build TeX images from cold; keep the PR step bounded below.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          uv sync --locked
          uv pip install --no-deps -e tests/compatibility
      - name: PR container and child-job lifecycle gate
        timeout-minutes: 15
        if: github.event_name == 'pull_request'
        run: uv run pytest -m docker tests/test_audit.py::test_an_audit_runs_inside_the_benchmark tests/test_lifecycle.py
      - name: Pytest (docker)
        if: github.event_name != 'pull_request'
        run: uv run pytest -m docker
