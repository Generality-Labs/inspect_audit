# The Epoch AI benchmark review page, as a template over the records.
#
# A template owns layout and the prose blocks a reader needs; the methodology owns the
# checks, their scales and the verdict rule. Prose blocks are written by the investigator
# at the end of the run (not synthesised afterwards) and validated against the limits here.
id: epoch-review
version: 1
methodology: epoch-rubric@1
audience: >-
  People with a scientific background who do not work on model evaluations. They want to
  know what the benchmark measures, whether its number can be trusted, and what to keep in
  mind when they quote it. They will not read a long document.
style:
  max_sentences_per_paragraph: 5
  rules:
    - Short sentences, one idea each; no paragraph longer than five sentences.
    - No jargon. Say "the model that reads the answer out of the response", not "the extractor"; "a reference answer", not "gold". Expand an acronym the first time.
    - Numbers with their denominators, not adjectives. Lead with the conclusion, then the evidence.
    - Do not narrate the investigation; execution details, costs and pipeline errors belong in the journal.
title: "{benchmark} Review"
notices:
  no_logs: >-
    No evaluation logs were supplied for this review, so the benchmark-wide checks
    (consistency, elicitation and bias) were not reviewed and the verdict cannot be
    Verified.
footnotes:
  title: Footnotes
  max_words: 60
  max_items: 12
  brief: >-
    Evidence detail that supports a sentence on the page without cluttering it: counts with
    their denominators, model names and settings, dates, versions, locators. Refer to a
    footnote as [^n] from any prose block or rubric note; a Flag's impact is appended as a
    footnote for you. A footnote supports a claim already made; it never introduces one.
header:
  - label: Benchmark
    value: profile.benchmark
  - label: Benchmark creator
    value: profile.creator
  - label: Verdict
    value: verdict
  - label: Review date
    value: profile.review_date
    format: ordinal_date
blocks:
  - id: summary
    title: Summary
    kind: prose
    max_words: 150
    when: [Verified, Flawed, NEI, Incomplete]
    required: [Verified, Flawed, NEI, Incomplete]
    brief: >-
      How the task works and what it tries to measure, what the best score is, and the key
      observations that decided the verdict. A reader who stops here knows the verdict and why.
  - id: methodology
    title: Methodology
    kind: prose
    max_words: 125
    when: [Verified, Flawed, NEI, Incomplete]
    required: [Verified, Flawed, NEI, Incomplete]
    brief: >-
      What was done: which logs were supplied, or that none were; which source was read;
      which per-item audits ran and on how many items; what was computed; what was not done.
      The prevalence line in the rubric prints the counts, so do not repeat them here.
  - id: interpretation
    title: Interpretation
    kind: prose
    max_words: 250
    max_paragraphs: 3
    max_sentences_per_paragraph: 4
    when: [Verified]
    required: [Verified]
    brief: >-
      Three short paragraphs at most, in this order. First, what the benchmark claims to
      measure and what one score means in a reader's terms. Second, what the number is and is
      not: what counts as a success, how results are aggregated, and the reading a reader
      should not make of it. Third, which of the review's findings bear on that reading, and
      how and why. No run statistics, settings or harness details; those belong in the
      elicitation block or a footnote.
  - id: task_analysis
    title: Task Analysis
    kind: prose
    max_words: 300
    when: [Verified]
    required: [Verified]
    brief: >-
      How the tasks work, how they were created, whether they are reasonable, and how they
      are graded. Name any issue that matters to the score, with its count and denominator.
  - id: elicitation_and_scaffolding
    title: Elicitation and Scaffolding
    kind: prose
    max_words: 300
    when: [Verified]
    required: [Verified]
    brief: >-
      The harness, prompting and tools the model is given; limits on tokens, turns or time;
      cost and resources where known; whether these settings let models show what they can do.
  - id: representative_errors
    title: Representative Errors
    kind: bullets
    max_sentences: 3
    max_items: 5
    plain: true
    when: [Verified, Flawed, NEI, Incomplete]
    required: [Flawed]
    required_when_defects: true
    lead:
      Flawed: The following issues cross our threshold for a Flawed verdict.
      default: >-
        The following errors were found in specific tasks. They do not cross our threshold for
        a Flawed verdict.
    brief: >-
      One bullet per defect class present in the errors table, in order of how many rows it
      covers: name the class as the table names it, say how many rows it covers, and give one
      or two of those rows as examples described by what is wrong, not by id. A run-level
      error gets its own bullet. Nothing else: no definitions of the classes, no caveats about
      unresolved or unassessed items, no sampling notes; those belong in the scoring row and
      the methodology block.
  - id: error_examples
    kind: table
    when: [Verified, Flawed, NEI, Incomplete]
    required: [Flawed]
    required_when_defects: true
    max_cell_words: 30
    footer: coverage_ids
    columns:
      - {key: task, title: Task}
      - {key: error_type, title: Error type}
      - {key: notes, title: Notes, plain: true, max_words: 25}
      - {key: affected_logs, title: Affected logs}
    brief: >-
      Every recorded error. One row for each item coverage.json records as a defect, with
      Task naming its id, then any run-level errors; Error type is the defect class in a few
      words; Notes is one plain sentence saying what is wrong with the item, as its reader
      would see it, with no account of how that was found (start from the auditor's
      headline); Affected logs names the runs or models the error touches, with a count. The ids audited without a defect are listed under the table
      from coverage.json; you do not write them.
  - id: limitations
    title: Limitations
    kind: bullets
    max_sentences: 3
    when: [Verified, NEI, Incomplete]
    required: [Verified, NEI, Incomplete]
    lead:
      Verified: >-
        While none of these limitations cross our threshold for a Flawed verdict, they do
        inform how a reader should characterize this benchmark.
      default: The review did not reach a verdict. These points say why.
    brief: >-
      Concerns that did not change the verdict, one bullet each, starting straight on the
      point. For a review without a verdict, what could not be reviewed and why.
  - id: recommendations
    title: Recommendations
    kind: bullets
    max_sentences: 1
    max_items: 5
    closing: true
    when: [Verified, Flawed, NEI, Incomplete]
    required: [Verified, Flawed]
    brief: >-
      Addressed to the benchmark's creator, one bullet per defect class in the errors table
      or per limitation, each a check or practice that would catch that class across the
      whole benchmark: confirm every reference answer independently, verify each question
      determines a unique answer, test the grader on correct answers phrased differently.
      Name no individual items. A final bullet on publication or versioning only when the
      methodology block found results irreproducible. One sentence each.
rubric:
  title: Benchmark Review Rubric
  intro: rubric
  sections:
    - section: 1. Reviewability
      title: 1. Reviewability
      layout: levels
      columns: [Level, Meaning, Status, Notes]
    - section: 2. Scoring (minimum standard)
      title: 2. Scoring
      intro: minimum_standard
      layout: defect_classes
      columns: [Defect Class, Examples, Default Threshold for Flawed, Status, Notes]
      measure_line: true
    - section: 3. Evaluation quality
      title: 3. Evaluation Quality
      intro: quality
      layout: questions
      columns: [Question, Status, Notes]
  disclaimer: disclaimer
