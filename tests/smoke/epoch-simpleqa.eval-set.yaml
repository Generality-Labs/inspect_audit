name: ia-smoke-epoch-sqav
packages:
- inspect-ai==0.3.285
- inspect-audit[runner,k8s] @ git+https://github.com/Generality-Labs/inspect_audit@SELF
- epoch-bench[simpleqa] @ git+https://github.com/LaurenceWroe/epoch_bench.git@03e832812e00799fed2644e55f87c0bb2f16e2d2
tasks:
- package: inspect-audit[runner,k8s] @ git+https://github.com/Generality-Labs/inspect_audit@SELF
  name: inspect_audit
  items:
  - name: audit
    args:
      # SimpleQA Verified as Epoch runs it: the anti-abstention variant, reconstructed from
      # Epoch's published logs (the mirror dataset, row id = index + 1)
      repo: https://github.com/LaurenceWroe/epoch_bench.git
      revision: 03e832812e00799fed2644e55f87c0bb2f16e2d2
      target_task: bench/simpleqa_verified_anti_abstention
      source: bench.task.simpleqa_verified
      task_package: epoch-bench[simpleqa] @ git+https://github.com/LaurenceWroe/epoch_bench.git@03e832812e00799fed2644e55f87c0bb2f16e2d2
      paths:
      - bench/task/simpleqa_verified
      # five of the fifty rows Epoch's review sampled, two of them defects by the
      # adjudicated ground truth (667, 960); the whole fifty is the real phase-1 run
      investigation_samples: ["2", "26", "391", "667", "960"]
      checks:
      - question-labels
      publisher: epoch
      policy:
        models:
          auditor:
          - openai/openrouter/deepseek/deepseek-v4.1-flash-1017
          investigators:
          - openai/openrouter/deepseek/deepseek-v4.1-flash-1017
          subjects: []
          judges:
          - openrouter/openai/gpt-5-mini
        limits:
          max_concurrent_jobs: 3
          budget_usd: 3.0
      runs: hawk
      # TEMPORARY (FRICTION 93): children with the operator's login until Hawk has its token service
      credential_mode: user
      box: k8s
      child_secrets:
      - HF_TOKEN
      overview: 'SimpleQA Verified is Google''s 1,000-question factual recall benchmark; the variant under
        review is the one Epoch AI runs on its leaderboard, bench/simpleqa_verified_anti_abstention, whose
        prompt appends an anti-abstention instruction and whose grader is a model judge bound through the
        grader role (Epoch''s is gpt-5.6-terra; here gpt-5-mini stands in). This is phase 1, the task audit:
        no evaluation logs are supplied.'
      instructions: 'This case: an Epoch review, phase 1, no supplied logs. Jobs: send_investigators on the
        five samples, check question-labels, one job; every sample must end resolved (re-send a sample whose
        worker stopped without a verdict). Then rate reviewability, scoring_integrity (with
        fields.sample_design) and benchmark_consistency in auditor.ratings as the epoch-review skill says,
        submit, and publish with the epoch publisher: write prose.json, preview_review, publish_document.'
models:
- package: inspect-ai
  items:
  - name: openai/openrouter/deepseek/deepseek-v4.1-flash-1017
runner:
  secrets:
  - name: HF_TOKEN
    description: Hugging Face token; forwarded to child jobs for the dataset load
message_limit: 400
retry_attempts: 0
