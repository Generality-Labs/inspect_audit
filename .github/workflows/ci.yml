name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a newer push supersedes the run still going for the same PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Moving major tag on purpose (see .github/zizmor.yml): we own this repo,
    # so CI fixes flow in without a bump PR per template release. Dependabot
    # is told to leave it alone in .github/dependabot.yml — don't "helpfully"
    # pin this to an exact version, or copier update will just revert it.
    uses: Generality-Labs/python-project-template/.github/workflows/python-ci.yml@v1
    with:
      python-version: "3.13"

  # The docker suite exercises real containers (phoenix, seeding, mirrored
  # tools); slower, so it runs on demand and on main rather than every push.
  # pytest's default addopts deselect it, and the explicit -m here wins.
  docker:
    name: Docker tests
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked
      - name: Pytest (docker)
        run: uv run pytest -m docker
