[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspect_audit"
version = "0.0.1"
description = "Benchmark validity auditing for Inspect AI evals"
authors = [{ name = "Generality Labs" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT License" }
dependencies = [
    "inspect-ai>=0.3.259",
    "pandas>=2.0.0",
    "pillow>=10.0",
    "pyarrow>=10.0.1",
    "openai>=1.0",
    # k8s_sandbox passes newline-terminated Helm output to Version.parse;
    # semver 3.1 rejects that output before any audit sample can start.
    "semver>=3.0,<3.1",
]

[project.entry-points.inspect_ai]
inspect_audit = "inspect_audit._registry"

[project.scripts]
inspect-audit-findings = "inspect_audit.findings.cli:main"

[project.optional-dependencies]
# Hawk requires Python 3.13; the core package supports 3.11+.
remote = ["hawk[cli]>=3.4,<4; python_version >= '3.13'"]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-xdist",
    "pandas-stubs",
    "types-PyYAML",
    "hawk[cli]>=3.4,<4; python_version >= '3.13'",
]

[tool.ruff]
src = ["src"]
# Keep vendored skills unchanged.
extend-exclude = ["src/inspect_audit/skills"]

[tool.ruff.lint]
select = ["E", "W", "F", "D", "I", "B", "SIM101", "PLE"]
ignore = ["D10", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src"]
exclude = ["src/inspect_audit/skills/"]

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*", "inspect_evals", "inspect_evals.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon"]
